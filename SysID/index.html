<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>ArduPilot SysID (JS Native)</title>
    <link rel="icon" href="../images/AP_favicon.png">

    <!-- Mathematics and Signal Processing Libraries -->
    <script type="text/javascript" src="../Libraries/fft.js"></script>
    <script type="text/javascript" src="../Libraries/Array_Math.js"></script>
    <script type="text/javascript" src="../Libraries/Plotly_helpers.js"></script>
    <script type="text/javascript" src="../Libraries/LogHelpers.js"></script>

    <script src="math.js"></script>
    <script src="../node_modules/fili/dist/fili.min.js"></script>
    <script src="ml.min.js"></script>

    <script src="../modules/build/floating-ui/dist/umd/popper.min.js"></script>
    <script src="../modules/build/tippyjs/dist/tippy-bundle.umd.min.js"></script>
    <script src="../modules/plotly.js/dist/plotly.min.js"></script>
    <script src='../modules/fft.js/dist/fft.js'></script>

    <style>
        body { font-family: sans-serif; margin: 20px; }
        div.plotly-notifier { visibility: hidden; }
        .setup-field { width: 1200px; margin-bottom: 20px; }
        fieldset { border: 1px solid #ccc; padding: 15px; border-radius: 5px; }
        input[type="number"], input[type="text"] { padding: 5px; border: 1px solid #ccc; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        button:disabled { background: #ccc; }
        textarea { font-family: monospace; background: #f8f8f8; }
    </style>
</head>

<body>
    <table style="width:1200px">
        <tr>
            <td><a href="https://ardupilot.org"><img src="../images/ArduPilot.png" width="100"></a></td>
            <td><h1>ArduPilot System Identification (Native JS)</h1></td>
        </tr>
    </table>

    <fieldset class="setup-field">
        <legend>Setup</legend>
        <label>Start (s): <input id="starttime" type="number" step="1" value="0"></label>
        <label>End (s): <input id="endtime" type="number" step="1" value="0"></label>
        <input id="fileItem" type="file" accept=".bin" onchange="readFile(this)" style="margin-left: 50px;">
    </fieldset>

    <div id="FlightData" style="width:1200px;height:400px"></div>

    <div style="margin: 20px 0;">
        <input type="radio" id="tf_select" name="ID_type" checked> <label for="tf_select">Transfer Function Identification</label>
        <br><br>
        <div id="tf_form">
            <div id="tf_inputFieldsContainer"></div>
            <div id="tf_outputFieldsContainer"></div>
            <br>
            <label>Numerator: <input type="text" id="customNumerator" value="K" placeholder="e.g. K"></label>
            <label>Denominator: <input type="text" id="customDenominator" value="s + a" placeholder="e.g. s^2 + a*s + b"></label>
            <label>Symbols: <input type="text" id="tf_params" value="K, a" placeholder="K, a"></label>
        </div>
    </div>

    <div style="margin-bottom: 20px;">
        <label>Start Freq (rad/s): <input type="number" id="startfreq" value="1"></label>
        <label>End Freq (rad/s): <input type="number" id="endfreq" value="50"></label>
        <label>LPF Cutoff (rad/s): <input type="number" id="cutofffreq" value="100"></label>
        <label>FFT Window Size: <input id="FFTWindow_size" name="FFTWindow_size" type="number" min="1" step="1" value="1024" onchange="window_size_inc(event)" style="width:50px"/></label>
        <button id="parseButton" type="button" disabled onclick="runIdentification()">Run Identification</button>
    </div>

    <div id="plotmag" style="width:1200px;height:800px"></div>
    <div id="plotphase" style="width:1200px;height:800px"></div>

    <p>Output Console:</p>
    <textarea id="output" style="width: 1200px; height: 200px;" readonly></textarea>

    <script>
        // --- DATAFLASH PARSER SIMULATION / HOOK ---
        var DataflashParser;
        import('../modules/JsDataflashParser/parser.js').then((mod) => { 
            DataflashParser = mod.default; 
            addToOutput("Log Parser Loaded.");
        });

        let log = null;
        const outputBox = document.getElementById("output");

        function addToOutput(msg) {
            outputBox.value += msg + "\n";
            outputBox.scrollTop = outputBox.scrollHeight;
        }

        function readFile(input) {
            const file = input.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                log = new DataflashParser();
                log.processData(reader.result, []);
                addToOutput("Log Loaded: " + file.name);
                document.getElementById("parseButton").disabled = false;
                setupInitialUI();
            };
            reader.readAsArrayBuffer(file);
        }

        function setupInitialUI() {
            // Populate Input/Output Selects
            const types = Object.keys(log.messageTypes).sort();
            const containers = ['tf_inputFieldsContainer', 'tf_outputFieldsContainer'];
            
            containers.forEach(id => {
                const div = document.getElementById(id);
                div.innerHTML = (id.includes('input') ? 'Input: ' : 'Output: ');
                const selMsg = document.createElement('select');
                const selField = document.createElement('select');
                
                selMsg.innerHTML = '<option>None</option>' + types.map(t => `<option value="${t}">${t}</option>`).join('');
                selMsg.onchange = () => {
                    const fields = log.messageTypes[selMsg.value]?.expressions || [];
                    selField.innerHTML = fields.map(f => `<option value="${f}">${f}</option>`).join('');
                };
                
                div.appendChild(selMsg);
                div.appendChild(selField);
                
                // Set Defaults
                if(id.includes('input')) { selMsg.value = 'RATE'; selMsg.onchange(); selField.value = 'ROut'; }
                else { selMsg.value = 'RATE'; selMsg.onchange(); selField.value = 'R'; }
            });
        }

        // --- CORE MATH FUNCTIONS (Native JS) ---

        function applyFilter(data, dt, cutoffRad) {
            const fs = 1 / dt;
            const fc = cutoffRad / (2 * Math.PI); // Convert rad/s to Hz
            
            // 1. Check if the cutoff frequency is valid (Nyquist limit)
            if (fc >= fs / 2) {
                console.error("LPF Cutoff is too high for the data sample rate. Reducing cutoff.");
                return data; // Return unfiltered data to avoid crash
            }

            // 2. Create the calculator
            const iirCalculator = new Fili.CalcCascades();
            
            // 3. FIX: Call .lowpass() and specify 'butterworth' as the characteristic
            const coeffs = iirCalculator.lowpass({
                order: 4,
                characteristic: 'butterworth',
                Fs: fs,
                Fc: fc
            });
            
            // 4. Create and apply the filter
            const filter = new Fili.IirFilter(coeffs);
            return filter.filtfilt(data);
        }
        
        function computeFFT(signal) {
            // Simple power-of-two padding
            const n = signal.length;
            const nextPow2 = Math.pow(2, Math.ceil(Math.log2(n)));
            const padded = new Array(nextPow2).fill(0);
            for(let i=0; i<n; i++) padded[i] = signal[i];
            
            // Use Math.js FFT
            return math.fft(padded);
        }

        // A robust iterative FFT (Radix-2) to replace math.fft
        function iterativeFFT(real) {
            const N = real.length;
            if ((N & (N - 1)) !== 0) throw new Error("FFT length must be a power of 2");

            const outReal = new Float64Array(real);
            const outImag = new Float64Array(N);

            // Bit-reversal permutation
            for (let i = 1, j = 0; i < N; i++) {
                let bit = N >> 1;
                for (; j & bit; bit >>= 1) j ^= bit;
                j ^= bit;
                if (i < j) {
                    [outReal[i], outReal[j]] = [outReal[j], outReal[i]];
                }
            }

            // Iterative butterflies
            for (let len = 2; len <= N; len <<= 1) {
                let ang = 2 * Math.PI / len;
                let wlenReal = Math.cos(ang);
                let wlenImag = -Math.sin(ang);
                for (let i = 0; i < N; i += len) {
                    let wReal = 1;
                    let wImag = 0;
                    for (let j = 0; j < len / 2; j++) {
                        let uReal = outReal[i + j];
                        let uImag = outImag[i + j];
                        let vReal = outReal[i + j + len / 2] * wReal - outImag[i + j + len / 2] * wImag;
                        let vImag = outReal[i + j + len / 2] * wImag + outImag[i + j + len / 2] * wReal;
                        outReal[i + j] = uReal + vReal;
                        outImag[i + j] = uImag + vImag;
                        outReal[i + j + len / 2] = uReal - vReal;
                        outImag[i + j + len / 2] = uImag - vImag;
                        let tmpReal = wReal * wlenReal - wImag * wlenImag;
                        wImag = wReal * wlenImag + wImag * wlenReal;
                        wReal = tmpReal;
                    }
                }
            }

            // Convert to Math.js complex format for compatibility with the rest of your code
            const results = [];
            for (let i = 0; i < N; i++) {
                results.push(math.complex(outReal[i], outImag[i]));
            }
            return results;
        }

        var last_window_size
        function window_size_inc(event) {
            if (last_window_size == null) {
                last_window_size = parseFloat(event.target.defaultValue)
            }
            const new_value = parseFloat(event.target.value)
            const change = parseFloat(event.target.value) - last_window_size
            if (Math.abs(change) != 1) {
                // Assume a change of one is comming from the up down buttons, ignore angthing else
                last_window_size = new_value
                return
            }
            var new_exponent = Math.log2(last_window_size)
            if (!Number.isInteger(new_exponent)) {
                // Move to power of two in the selected direction
                new_exponent = Math.floor(new_exponent)
                if (change > 0) {
                    new_exponent += 1
                }

            } else if (change > 0) {
                // Move up one
                new_exponent += 1

            } else {
                // Move down one
                new_exponent -= 1

            }
            event.target.value = 2**new_exponent
            last_window_size = event.target.value
        }

async function runIdentification() {
            addToOutput("Starting Analysis (Averaged FFT segments)...");
            
            const tStart = parseFloat(document.getElementById('starttime').value);
            const tEnd = parseFloat(document.getElementById('endtime').value);
            const fStart = parseFloat(document.getElementById('startfreq').value);
            const fEnd = parseFloat(document.getElementById('endfreq').value);
            const fCutoff = parseFloat(document.getElementById('cutofffreq').value);
            const windowSize = parseInt(document.getElementById('FFTWindow_size').value);

            // 1. Get and Pre-process Data
            const inMsg = document.getElementById('tf_inputFieldsContainer').querySelectorAll('select')[0].value;
            const inFld = document.getElementById('tf_inputFieldsContainer').querySelectorAll('select')[1].value;
            const outMsg = document.getElementById('tf_outputFieldsContainer').querySelectorAll('select')[0].value;
            const outFld = document.getElementById('tf_outputFieldsContainer').querySelectorAll('select')[1].value;

            if (inMsg === "None" || outMsg === "None") {
                addToOutput("Error: Please select input and output fields.");
                return;
            }

            let time = Array.from(log.get(inMsg, "TimeUS")).map(t => t / 1000000);
            let u_raw = Array.from(log.get(inMsg, inFld));

            const idxStart = time.findIndex(t => t >= tStart);
            const idxEnd = time.findIndex(t => t >= tEnd);
            if (idxStart === -1 || idxEnd === -1) { addToOutput("Error: Invalid time range."); return; }
            
            const dt = (time[idxEnd-1] - time[idxStart]) / (idxEnd - idxStart);
            const u_sliced = u_raw.slice(idxStart, idxEnd);
            addToOutput(`Sample rate: ${(1/dt).toFixed(1)} Hz. Data points: ${u_sliced.length}`);

            let out_time = Array.from(log.get(outMsg, "TimeUS")).map(t => t / 1000000);
            let y_raw = Array.from(log.get(outMsg, outFld));
            const outStart = out_time.findIndex(t => t >= tStart);
            const outEnd = out_time.findIndex(t => t >= tEnd);
            const y_sliced = y_raw.slice(outStart, outEnd);

            // Scaling output to radians
            const y_rad = y_sliced.map(val => val * (Math.PI / 180)); 

            // Apply LPF to both signals
            const u_filt = applyFilter(u_sliced, dt, fCutoff);
            const y_filt = applyFilter(y_rad, dt, fCutoff);

            // --- 2. Averaged Frequency Response Estimation (Welch's Method) ---
            const step = Math.floor(windowSize / 2); // 50% overlap
            let segmentCount = 0;

            const S_uu = new Array(windowSize / 2).fill(0).map(() => math.complex(0, 0));
            const S_uy = new Array(windowSize / 2).fill(0).map(() => math.complex(0, 0));

            const hanning = new Float64Array(windowSize);
            for (let i = 0; i < windowSize; i++) {
                hanning[i] = 0.5 * (1 - Math.cos(2 * Math.PI * i / (windowSize - 1)));
            }

            for (let offset = 0; offset + windowSize <= u_filt.length; offset += step) {
                const u_seg = u_filt.slice(offset, offset + windowSize);
                const y_seg = y_filt.slice(offset, offset + windowSize);

                const u_win = u_seg.map((v, i) => v * hanning[i]);
                const y_win = y_seg.map((v, i) => v * hanning[i]);

                const U = iterativeFFT(u_win);
                const Y = iterativeFFT(y_win);

                for (let k = 0; k < windowSize / 2; k++) {
                    const U_conj = math.conj(U[k]);
                    S_uu[k] = math.add(S_uu[k], math.multiply(U[k], U_conj));
                    S_uy[k] = math.add(S_uy[k], math.multiply(Y[k], U_conj));
                }
                segmentCount++;
            }

            if (segmentCount === 0) {
                addToOutput("Error: Data range too short for selected Window Size.");
                return;
            }

            const freqs = [];
            const H_mag = [];
            const H_phase = [];
            const complexH = []; // This will store our target complex points

            for (let k = 0; k < windowSize / 2; k++) {
                const f = (k * (1/dt)) / windowSize * 2 * Math.PI; 
                if (f < fStart || f > fEnd) continue;

                const valH = math.divide(S_uy[k], S_uu[k]);
                freqs.push(f);
                complexH.push(valH); // FIX: Add data to complexH

                H_mag.push(20 * Math.log10(math.abs(valH)));
                H_phase.push(math.atan2(valH.im, valH.re) * 180 / Math.PI);
            }

            // --- 3. Fitting ---
            const symStr = document.getElementById('tf_params').value.split(',').map(s => s.trim()).filter(s => s !== "");
            const numExpr = document.getElementById('customNumerator').value;
            const denExpr = document.getElementById('customDenominator').value;
            const tauIndex = symStr.indexOf('tau');

            let compiledNum, compiledDen;
            try {
                compiledNum = math.compile(numExpr);
                compiledDen = math.compile(denExpr);
            } catch (e) {
                addToOutput("Math Syntax Error: " + e.message);
                return;
            }

            // The model returns WEIGHTED Real/Imag parts based on target magnitude
            const complexModel = (params) => (idx) => {
                const freqIdx = Math.floor(idx / 2);
                const isImaginary = idx % 2 === 1;
                const w = freqs[freqIdx];
                const targetMag = math.abs(complexH[freqIdx]); // complexH is now defined

                const scope = { s: math.complex(0, w) };
                for (let i = 0; i < symStr.length; i++) scope[symStr[i]] = params[i];

                try {
                    let res = math.divide(compiledNum.evaluate(scope), compiledDen.evaluate(scope));
                    if (tauIndex !== -1) {
                        const delayTerm = math.exp(math.multiply(math.complex(0, -params[tauIndex]), w));
                        res = math.multiply(res, delayTerm);
                    }
                    
                    // Normalize by target magnitude to prioritize relative error
                    const weightedRes = math.divide(res, targetMag || 1e-6);
                    return isImaginary ? weightedRes.im : weightedRes.re;
                } catch (e) { return 0; }
            };

            // Build weighted target data: [Re/mag, Im/mag, ...]
            const weightedTargetData = [];
            complexH.forEach(h => {
                const mag = math.abs(h) || 1e-6;
                weightedTargetData.push(h.re / mag);
                weightedTargetData.push(h.im / mag);
            });

            // Improved Initial Guess Logic
            const firstMag = math.abs(complexH[0]); 
            const initialValues = symStr.map(s => {
                if (s === 'a') return 3599;     // Standard gain symbol
                if (s === 'b') return 0.0;     // Standard gain symbol
                if (s === 'c') return 1.0;     // Standard gain symbol
                if (s === 'd') return 32;     // Standard gain symbol
                if (s === 'e') return 199.4;     // Standard gain symbol
                if (s === 'f') return 654;     // Standard gain symbol
                if (s === 'g') return 1091;     // Standard gain symbol
                if (s === 'tau') return 0.001;      // 30ms typical delay
                return 1.0;
            });
            
            const options = { 
                initialValues: initialValues,
                minValues: symStr.map(() => 0),     // Force positive
                damping: 0.5,
                maxIterations: 200,
                errorTolerance: 1e-6, 
                gradientDifference: 1e-5
            };

            addToOutput("Starting Complex Optimizer...");
            const xIndices = Array.from({length: weightedTargetData.length}, (_, i) => i);
            const dataToFit = { x: xIndices, y: weightedTargetData };

            try {
                const fitResult = ML.levenbergMarquardt(dataToFit, complexModel, options);
                
                // Calculate Goodness of Fit measures
                const totalSquaredError = fitResult.parameterError; // Sum of squared residuals
                const numDataPoints = dataToFit.y.length;   // freqs.length * 2 (Real and Imaginary)
                const mse = totalSquaredError / numDataPoints;
                const rmse = Math.sqrt(mse);

                addToOutput("--- Fit Quality ---");
                // totalSquaredError is the 'Cost'
                addToOutput(`Total Cost (J): ${totalSquaredError.toFixed(4)}`);
                // RMSE gives the average error magnitude per point
                addToOutput(`Average Error (RMSE): ${(rmse * 100).toFixed(2)}%`);

                addToOutput("--- Fit Result ---");
                symStr.forEach((s, i) => {
                    addToOutput(`${s}: ${fitResult.parameterValues[i].toFixed(6)}`);
                });

                // Generate Fit Curves for Plotting
                const fit_mag = [];
                const fit_phase = [];
                const finalParams = fitResult.parameterValues;

                freqs.forEach(w => {
                    const scope = { s: math.complex(0, w) };
                    for (let i = 0; i < symStr.length; i++) scope[symStr[i]] = finalParams[i];
                    
                    let res = math.divide(compiledNum.evaluate(scope), compiledDen.evaluate(scope));
                    if (tauIndex !== -1) {
                        const delayTerm = math.exp(math.multiply(math.complex(0, -finalParams[tauIndex]), w));
                        res = math.multiply(res, delayTerm);
                    }

                    fit_mag.push(20 * Math.log10(math.abs(res)));
                    fit_phase.push(math.atan2(res.im, res.re) * 180 / Math.PI);
                });

                // 5. Plotting
                const tracesmag = [
                    { x: freqs, y: H_mag, name: 'Log Data (Avg)', type: 'scatter', mode: 'markers', marker: {size: 4, opacity: 0.6} },
                    { x: freqs, y: fit_mag, name: 'Fit', type: 'scatter', mode: 'lines', line: {color: 'red'} },
                ];
                const tracesphase = [
                    { x: freqs, y: H_phase, name: 'Log Data (Avg)', type: 'scatter', mode: 'markers', marker: {size: 4, opacity: 0.6} },
                    { x: freqs, y: fit_phase, name: 'Fit', type: 'scatter', mode: 'lines', line: {color: 'red'} }
                ];

                Plotly.newPlot('plotmag', tracesmag, { title: 'Magnitude (dB)', xaxis: {type: 'log', title: 'rad/s'}, yaxis: {title: 'dB'} });
                Plotly.newPlot('plotphase', tracesphase, { title: 'Phase (deg)', xaxis: {type: 'log', title: 'rad/s'}, yaxis: {title: 'deg'} });

            } catch (err) {
                addToOutput("Optimizer failed: " + err);
                console.error(err);
            }
        }
    </script>
</body>
</html>
